<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Plate Scan</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#000000">

  <!-- ML Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; background: #121212; color: white; }
    #controls { padding: 12px; background: #1e1e1e; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #333; }
    #camera-container { position: relative; width: 100vw; max-width: 600px; margin: auto; }
    video { width: 100%; height: auto; display: block; }
    button { padding: 14px 28px; font-size: 18px; font-weight: bold; width: 90%; max-width: 400px; border-radius: 8px; border: none; background: #007bff; color: white; cursor: pointer; }
    button:disabled { background: #555555; cursor: not-allowed; }
    #results { margin-top: 15px; text-align: left; padding: 0 20px; }
  </style>
</head>
<body>

  <!-- Fixed Top Header -->
  <div id="controls">
    <button id="capture-btn">Scan Plate</button>
  </div>

  <div id="camera-container">
    <video id="camera" autoplay playsinline></video>
    <canvas id="snapshot" style="display:none;"></canvas>
  </div>

  <div id="results"></div>

  <!-- Main App Script -->
  <script src="app.js"></script>
  <script>
    const captureBtn = document.getElementById('capture-btn');
    const resultsDiv = document.getElementById('results');

    // 1. Initialize camera
    startCamera().catch(err => {
      resultsDiv.innerHTML = `<p style="color:red;">Camera Error: ${err.message}</p>`;
    });

    // 2. Load models
    captureBtn.disabled = true;
    captureBtn.innerText = 'Loading AI Models...';

    initModels().then(() => {
      captureBtn.disabled = false;
      captureBtn.innerText = 'Scan Plate';
    }).catch(err => {
      captureBtn.disabled = false;
      captureBtn.innerText = 'Scan Plate (Error)';
      resultsDiv.innerHTML = `<p style="color:red;">Failed to load AI models: ${err.message}</p>`;
    });

    // 3. Capture event handler
    captureBtn.addEventListener('click', async () => {
      try {
        captureBtn.disabled = true;
        captureBtn.innerText = 'Analyzing Image...';
        resultsDiv.innerHTML = '<p style="color:#007bff;">Processing image scan...</p>';
        
        const snapCanvas = captureFrame();
        const results = await processImage(snapCanvas);

        if (!results || results.length === 0) {
          resultsDiv.innerHTML = '<p>No vehicles detected in frame.</p>';
        } else {
          resultsDiv.innerHTML = results.map(r => 
            `<p>🚗 <strong>${r.vehicleType}:</strong> Plate: <code>${r.licensePlate}</code> (${Math.round(r.textConfidence || 0)}% confidence)</p>`
          ).join('');
        }
      } catch (err) {
        console.error(err);
        resultsDiv.innerHTML = `<p style="color:red;">Scan Error: ${err.message}</p>`;
      } finally {
        captureBtn.disabled = false;
        captureBtn.innerText = 'Scan Plate';
      }
    });

    // PWA SW
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration error:', err));
    }
  </script>
</body>
</html>
